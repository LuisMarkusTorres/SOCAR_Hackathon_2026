[project]
name = "wellperf"
version = "0.1.0"
description = "Intelligent Well Performance Analysis: Virtual Flow Metering + automated build-up PTA"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
