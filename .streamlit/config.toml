[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b0f1a"
secondaryBackgroundColor = "#121a2b"
textColor = "#e6eaf2"
borderColor = "#1e293b"
showWidgetBorder = true
baseRadius = "medium"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#0d1322"
secondaryBackgroundColor = "#141d31"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
